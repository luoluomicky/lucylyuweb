[build]
  publish = "."

# ── Security headers ──
# CSP is deliberately conservative: the site has ZERO external hosts
# (no CDN, no Google Fonts, no analytics), but every page carries inline
# <style> blocks and inline <script>/onclick, so 'unsafe-inline' is required
# for script-src and style-src. data: is needed for the SVG paper-noise texture.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'"

# RSS：显式 XML 类型，阅读器识别更稳
[[headers]]
  for = "/feed.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"

[[redirects]]
  from = "/pilates"
  to = "/pilates/"
  status = 301

[[redirects]]
  from = "/work"
  to = "/work/"
  status = 301

[[redirects]]
  from = "/about"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/ai"
  to = "/ai/"
  status = 301
