/* Arrow buttons */
.viewer-arrow {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 44px; height: 44px; border-radius: 50%;

  display: flex; align-items: center; justify-content: center;

  font-size: 20px; color: var(--section-muted);
  transition: all 0.2s;
  backdrop-filter: blur(4px);
}
.viewer-arrow:hover { background: #fff; color: var(--section-accent); border-color: var(--section-accent); box-shadow: 0 2px 12px rgba(44,38,33,0.10); }
.viewer-arrow-left  { left: 12px; }
.viewer-arrow-right { right: 12px; }
.card-viewer {
  display: flex; gap: 0;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  scrollbar-color: var(--section-border) transparent;
  padding: 0 0 32px;
  align-items: start;
}
.card-viewer::-webkit-scrollbar { height: 4px; }
.card-viewer::-webkit-scrollbar-thumb { background: var(--section-border); border-radius: 2px; }
.card-viewer .card-frame {
  flex: 0 0 auto;
  scroll-snap-align: center;
  height: 68vh; max-height: 780px;
  padding: 18px 18px 0;

  margin: 0 10px;
  border-radius: 2px;
  box-shadow: 0 2px 12px rgba(44,38,33,0.07), 0 8px 32px rgba(44,38,33,0.05);
  display: flex; flex-direction: column; align-items: center;
}
.card-viewer .card-frame:first-child { margin-left: calc(50% - 120px); }
.card-viewer .card-frame:last-child  { margin-right: calc(50% - 120px); }
.card-viewer .card-frame img {
  display: block;
  height: calc(100% - 36px);
  width: auto;
  border-radius: 1px;
  object-fit: contain;
}
.card-viewer .card-num {
  text-align: center; padding: 8px 0;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em;

.carousel-detail .caption {

<script>
document.querySelectorAll(".viewer-arrow").forEach(btn => {
  btn.addEventListener("click", () => {
    const viewer = btn.closest(".card-viewer-wrap").querySelector(".card-viewer");
    const dir = btn.classList.contains("viewer-arrow-left") ? -1 : 1;
    viewer.scrollBy({ left: dir * 420, behavior: "smooth" });
  });
});
</script>
